name: 更新官网动态快照

on:
  schedule:
    # 每 2 小时的第 10 分钟跑一次（UTC；北京时间 = UTC+8）
    - cron: '10 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: campus-news
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 抓取要闻与通知
        run: node scripts/crawl-news.js

      - name: 提交快照
        run: |
          git config user.name "campus-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: update campus news snapshot"
            git push
          fi
